[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "streamlit-webrtc-native"
description = "Experimental native audio peer for streamlit-webrtc"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
dependencies = ["av>=15.1.0", "numpy>=1.23"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "maturin>=1.15,<2", "aiortc>=1.14.0"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "streamlit_webrtc_native._native"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["streamlit_webrtc_native"]
